name: Portfolio CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/.htaccess

      - name: Upload production artifact
        uses: actions/upload-artifact@v6
        with:
          name: portfolio-static
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy-test:
    needs: build-and-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download production artifact
        uses: actions/download-artifact@v7
        with:
          name: portfolio-static
          path: out

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.NC_SSH_KEY }}" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy

          printf '%s\n' "${{ secrets.NC_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH host entry
        run: |
          echo "Checking known_hosts entry..."
          ssh-keygen -F "[${{ vars.NC_HOST }}]:${{ vars.NC_PORT }}" -f ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/namecheap_deploy \
            -p "${{ vars.NC_PORT }}" \
            "${{ vars.NC_USER }}@${{ vars.NC_HOST }}" \
            "echo 'GitHub Actions SSH connection successful'"

      - name: Deploy to safe test directory
        run: |
          rsync -az \
            --delete \
            -e "ssh -i ~/.ssh/namecheap_deploy -p ${{ vars.NC_PORT }}" \
            out/ \
            "${{ vars.NC_USER }}@${{ vars.NC_HOST }}:/home/trektrwu/khandkershahed-cicd-test/"

  deploy-production-dry-run:
    needs: deploy-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download production artifact
        uses: actions/download-artifact@v7
        with:
          name: portfolio-static
          path: out

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.NC_SSH_KEY }}" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy

          printf '%s\n' "${{ secrets.NC_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Production deployment dry run
        run: |
          rsync -az \
            --dry-run \
            --delete \
            --itemize-changes \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            -e "ssh -i ~/.ssh/namecheap_deploy -p ${{ vars.NC_PORT }}" \
            out/ \
            "${{ vars.NC_USER }}@${{ vars.NC_HOST }}:${{ vars.NC_DEPLOY_PATH }}/"
